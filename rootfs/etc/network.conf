# Ethernet is enabled at boot. DEV9/SMAP must already be built into the kernel.
# Values are data, never evaluated as shell commands.
ENABLED=yes
DEVICE=eth0
MODE=dhcp
# For MODE=static set ADDRESS to IPv4/prefix, e.g. 192.168.1.20/24.
ADDRESS=
GATEWAY=
# Space-separated IPv4 DNS servers, used only with MODE=static.
DNS=
