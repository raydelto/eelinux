Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontZap" "false"
    Option "AllowMouseOpenFail" "true"
EndSection

Section "Files"
    FontPath "/usr/share/fonts/X11/misc"
EndSection

Section "Device"
    Identifier "PS2 framebuffer"
    # Requires the native GS DDX. The launcher rejects missing hardware support.
    Driver "ps2"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "false"
EndSection

Section "Monitor"
    Identifier "PS2 display"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "PS2 framebuffer"
    Monitor "PS2 display"
    DefaultDepth 15
    SubSection "Display"
        Depth 15
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "evdev"
    # The session launcher detects a keyboard and replaces this path.
    Option "Device" "/dev/input/event0"
    # The session launcher applies /etc/default/keyboard. US/ANSI is the default.
    Option "XkbLayout" "us"
    Option "XkbModel" "pc104"
    Option "XkbRules" "evdev"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "mouse"
    Option "Device" "/dev/input/mice"
    Option "Protocol" "auto"
EndSection

Section "ServerLayout"
    Identifier "PS2 desktop"
    Screen "Screen0"
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
EndSection
